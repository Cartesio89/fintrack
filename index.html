<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1f2937">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>FinTrack Pro</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { overscroll-behavior-y: none; }
  </style>
</head>
<body class="bg-gray-900 text-gray-100">
  <div id="app"></div>

  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed'));
    }

    const { createClient } = supabase;
    const DB_NAME = 'FinTrackDB';
    const DB_VERSION = 2; // CAMBIATO DA 1 A 2 PER FORZARE UPGRADE

    // UUID generator (RFC4122 v4)
    function generateUUID() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        const v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    let state = {
      view: 'dashboard',
      accounts: [],
      categories: [],
      transactions: [],
      filterYear: new Date().getFullYear(),
      filterAccount: 'all',
      filterCategory: 'all',
      menuOpen: false,
      currentModal: null,
      editingItem: null,
      supabaseClient: null,
      showSupabaseSetup: false,
      syncing: false,
      lastSync: null
    };

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve(request.result);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          
          // ELIMINA STORE VECCHI SE ESISTONO
          if (db.objectStoreNames.contains('accounts')) {
            db.deleteObjectStore('accounts');
          }
          if (db.objectStoreNames.contains('categories')) {
            db.deleteObjectStore('categories');
          }
          if (db.objectStoreNames.contains('transactions')) {
            db.deleteObjectStore('transactions');
          }
          
          // CREA NUOVI STORE CON UUID (NON auto-increment)
          db.createObjectStore('accounts', { keyPath: 'id' });
          db.createObjectStore('categories', { keyPath: 'id' });
          db.createObjectStore('transactions', { keyPath: 'id' });
          
          if (!db.objectStoreNames.contains('settings')) {
            db.createObjectStore('settings', { keyPath: 'key' });
          }
        };
      });
    }

    async function dbOperation(storeName, mode, operation) {
      const db = await initDB();
      const tx = db.transaction(storeName, mode);
      const store = tx.objectStore(storeName);
      return new Promise((resolve, reject) => {
        const request = operation(store);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function checkSupabaseConfig() {
      try {
        const url = await dbOperation('settings', 'readonly', store => store.get('supabase_url'));
        const key = await dbOperation('settings', 'readonly', store => store.get('supabase_key'));
        const lastSyncData = await dbOperation('settings', 'readonly', store => store.get('last_sync'));
        
        if (url?.value && key?.value) {
          state.supabaseClient = createClient(url.value, key.value);
          state.lastSync = lastSyncData?.value ? new Date(lastSyncData.value) : null;
          
          // Auto-sync all'avvio se online
          if (navigator.onLine) {
            await syncBidirectional();
          }
        } else {
          state.showSupabaseSetup = true;
        }
      } catch (err) {
        state.showSupabaseSetup = true;
      }
    }

    async function setupSupabase() {
      const url = document.getElementById('supa-url').value.trim();
      const key = document.getElementById('supa-key').value.trim();
      if (url && key) {
        state.supabaseClient = createClient(url, key);
        await dbOperation('settings', 'readwrite', store => store.put({ key: 'supabase_url', value: url }));
        await dbOperation('settings', 'readwrite', store => store.put({ key: 'supabase_key', value: key }));
        state.showSupabaseSetup = false;
        alert('✓ Supabase configurato!');
        await syncBidirectional();
        render();
      }
    }

    async function syncBidirectional() {
      if (!state.supabaseClient || state.syncing || !navigator.onLine) return;
      state.syncing = true;
      render();

      try {
        // Get ALL local data (including soft-deleted)
        const localAccountsAll = await dbOperation('accounts', 'readonly', store => store.getAll());
        const localCategoriesAll = await dbOperation('categories', 'readonly', store => store.getAll());
        const localTransactionsAll = await dbOperation('transactions', 'readonly', store => store.getAll());

        // Get cloud data
        const { data: cloudAccounts } = await state.supabaseClient.from('accounts').select('*');
        const { data: cloudCategories } = await state.supabaseClient.from('categories').select('*');
        const { data: cloudTransactions } = await state.supabaseClient.from('transactions').select('*');

        // MERGE ACCOUNTS
        const mergedAccounts = new Map();
        
        for (const acc of localAccountsAll) {
          mergedAccounts.set(acc.id, {
            id: acc.id,
            name: acc.name,
            initial_balance: acc.initialBalance,
            created_at: acc.createdAt,
            deleted: acc.deleted || false,
            deleted_at: acc.deleted_at || null,
            updated_at: acc.updated_at || acc.createdAt,
            source: 'local'
          });
        }
        
        for (const acc of (cloudAccounts || [])) {
          const local = mergedAccounts.get(acc.id);
          if (!local) {
            mergedAccounts.set(acc.id, {
              id: acc.id,
              name: acc.name,
              initial_balance: acc.initial_balance,
              created_at: acc.created_at,
              deleted: acc.deleted || false,
              deleted_at: acc.deleted_at || null,
              updated_at: acc.updated_at || acc.created_at,
              source: 'cloud'
            });
          } else {
            // Compare updated_at
            const localDate = new Date(local.updated_at);
            const cloudDate = new Date(acc.updated_at || acc.created_at);
            if (cloudDate > localDate) {
              mergedAccounts.set(acc.id, {
                id: acc.id,
                name: acc.name,
                initial_balance: acc.initial_balance,
                created_at: acc.created_at,
                deleted: acc.deleted || false,
                deleted_at: acc.deleted_at || null,
                updated_at: acc.updated_at || acc.created_at,
                source: 'cloud-newer'
              });
            }
          }
        }

        // MERGE CATEGORIES (stesso pattern)
        const mergedCategories = new Map();
        
        for (const cat of localCategoriesAll) {
          mergedCategories.set(cat.id, {
            id: cat.id,
            name: cat.name,
            color: cat.color,
            created_at: cat.createdAt,
            deleted: cat.deleted || false,
            deleted_at: cat.deleted_at || null,
            updated_at: cat.updated_at || cat.createdAt,
            source: 'local'
          });
        }
        
        for (const cat of (cloudCategories || [])) {
          const local = mergedCategories.get(cat.id);
          if (!local) {
            mergedCategories.set(cat.id, {
              id: cat.id,
              name: cat.name,
              color: cat.color,
              created_at: cat.created_at,
              deleted: cat.deleted || false,
              deleted_at: cat.deleted_at || null,
              updated_at: cat.updated_at || cat.created_at,
              source: 'cloud'
            });
          } else {
            const localDate = new Date(local.updated_at);
            const cloudDate = new Date(cat.updated_at || cat.created_at);
            if (cloudDate > localDate) {
              mergedCategories.set(cat.id, {
                id: cat.id,
                name: cat.name,
                color: cat.color,
                created_at: cat.created_at,
                deleted: cat.deleted || false,
                deleted_at: cat.deleted_at || null,
                updated_at: cat.updated_at || cat.created_at,
                source: 'cloud-newer'
              });
            }
          }
        }

        // MERGE TRANSACTIONS
        const mergedTransactions = new Map();
        
        for (const tx of localTransactionsAll) {
          mergedTransactions.set(tx.id, {
            id: tx.id,
            description: tx.description,
            account_id: tx.accountId,
            category_id: tx.categoryId,
            type: tx.type,
            amount: tx.amount,
            date: tx.date,
            hidden: tx.hidden,
            created_at: tx.createdAt,
            updated_at: tx.updatedAt || tx.createdAt,
            deleted: tx.deleted || false,
            deleted_at: tx.deleted_at || null,
            source: 'local'
          });
        }
        
        for (const tx of (cloudTransactions || [])) {
          const local = mergedTransactions.get(tx.id);
          if (!local) {
            mergedTransactions.set(tx.id, {
              id: tx.id,
              description: tx.description,
              account_id: tx.account_id,
              category_id: tx.category_id,
              type: tx.type,
              amount: tx.amount,
              date: tx.date,
              hidden: tx.hidden,
              created_at: tx.created_at,
              updated_at: tx.updated_at || tx.created_at,
              deleted: tx.deleted || false,
              deleted_at: tx.deleted_at || null,
              source: 'cloud'
            });
          } else {
            const localDate = new Date(local.updated_at);
            const cloudDate = new Date(tx.updated_at || tx.created_at);
            if (cloudDate > localDate) {
              mergedTransactions.set(tx.id, {
                id: tx.id,
                description: tx.description,
                account_id: tx.account_id,
                category_id: tx.category_id,
                type: tx.type,
                amount: tx.amount,
                date: tx.date,
                hidden: tx.hidden,
                created_at: tx.created_at,
                updated_at: tx.updated_at || tx.created_at,
                deleted: tx.deleted || false,
                deleted_at: tx.deleted_at || null,
                source: 'cloud-newer'
              });
            }
          }
        }

        // SAVE TO CLOUD (upsert tutti i dati merged)
        for (const acc of mergedAccounts.values()) {
          await state.supabaseClient.from('accounts').upsert({
            id: acc.id,
            name: acc.name,
            initial_balance: acc.initial_balance,
            created_at: acc.created_at,
            deleted: acc.deleted,
            deleted_at: acc.deleted_at,
            updated_at: acc.updated_at
          });
        }

        for (const cat of mergedCategories.values()) {
          await state.supabaseClient.from('categories').upsert({
            id: cat.id,
            name: cat.name,
            color: cat.color,
            created_at: cat.created_at,
            deleted: cat.deleted,
            deleted_at: cat.deleted_at,
            updated_at: cat.updated_at
          });
        }

        for (const tx of mergedTransactions.values()) {
          await state.supabaseClient.from('transactions').upsert({
            id: tx.id,
            description: tx.description,
            account_id: tx.account_id,
            category_id: tx.category_id,
            type: tx.type,
            amount: tx.amount,
            date: tx.date,
            hidden: tx.hidden,
            created_at: tx.created_at,
            updated_at: tx.updated_at,
            deleted: tx.deleted,
            deleted_at: tx.deleted_at
          });
        }

        // SAVE TO LOCAL (salva dati merged in IndexedDB)
        const db = await initDB();
        
        // Clear e riscrivi accounts
        let tx = db.transaction('accounts', 'readwrite');
        let store = tx.objectStore('accounts');
        await store.clear();
        for (const acc of mergedAccounts.values()) {
          await store.put({
            id: acc.id,
            name: acc.name,
            initialBalance: acc.initial_balance,
            createdAt: acc.created_at,
            deleted: acc.deleted,
            deleted_at: acc.deleted_at,
            updated_at: acc.updated_at
          });
        }

        // Clear e riscrivi categories
        tx = db.transaction('categories', 'readwrite');
        store = tx.objectStore('categories');
        await store.clear();
        for (const cat of mergedCategories.values()) {
          await store.put({
            id: cat.id,
            name: cat.name,
            color: cat.color,
            createdAt: cat.created_at,
            deleted: cat.deleted,
            deleted_at: cat.deleted_at,
            updated_at: cat.updated_at
          });
        }

        // Clear e riscrivi transactions
        tx = db.transaction('transactions', 'readwrite');
        store = tx.objectStore('transactions');
        await store.clear();
        for (const txData of mergedTransactions.values()) {
          await store.put({
            id: txData.id,
            description: txData.description,
            accountId: txData.account_id,
            categoryId: txData.category_id,
            type: txData.type,
            amount: txData.amount,
            date: txData.date,
            hidden: txData.hidden,
            createdAt: txData.created_at,
            updatedAt: txData.updated_at,
            deleted: txData.deleted,
            deleted_at: txData.deleted_at
          });
        }

        // Save last sync time
        state.lastSync = new Date();
        await dbOperation('settings', 'readwrite', store => 
          store.put({ key: 'last_sync', value: state.lastSync.toISOString() })
        );

        await loadData();
        alert('✓ Sincronizzazione completata!');
      } catch (err) {
        console.error('Sync error:', err);
        alert('✗ Errore sync: ' + err.message);
      } finally {
        state.syncing = false;
        render();
      }
    }

    async function loadData() {
      state.accounts = (await dbOperation('accounts', 'readonly', store => store.getAll()))
        .filter(a => !a.deleted);
      state.categories = (await dbOperation('categories', 'readonly', store => store.getAll()))
        .filter(c => !c.deleted);
      state.transactions = (await dbOperation('transactions', 'readonly', store => store.getAll()))
        .filter(t => !t.deleted);
      render();
    }

    async function saveAccount(name, balance) {
      if (!name.trim()) return alert('Nome richiesto');
      const acc = {
        id: generateUUID(), // USA UUID NON AUTO-INCREMENT
        name: name.trim(),
        initialBalance: parseFloat(balance) || 0,
        createdAt: new Date().toISOString(),
        updated_at: new Date().toISOString(),
        deleted: false,
        deleted_at: null
      };
      await dbOperation('accounts', 'readwrite', store => store.add(acc));
      if (state.supabaseClient && navigator.onLine) {
        await state.supabaseClient.from('accounts').insert({
          id: acc.id,
          name: acc.name,
          initial_balance: acc.initialBalance,
          created_at: acc.createdAt,
          updated_at: acc.updated_at,
          deleted: false,
          deleted_at: null
        });
      }
      closeModal();
      await loadData();
    }

    async function saveCategory(name, color) {
      if (!name.trim()) return alert('Nome richiesto');
      const cat = {
        id: generateUUID(), // USA UUID NON AUTO-INCREMENT
        name: name.trim(),
        color: color || '#3b82f6',
        createdAt: new Date().toISOString(),
        updated_at: new Date().toISOString(),
        deleted: false,
        deleted_at: null
      };
      await dbOperation('categories', 'readwrite', store => store.add(cat));
      if (state.supabaseClient && navigator.onLine) {
        await state.supabaseClient.from('categories').insert({
          id: cat.id,
          name: cat.name,
          color: cat.color,
          created_at: cat.createdAt,
          updated_at: cat.updated_at,
          deleted: false,
          deleted_at: null
        });
      }
      closeModal();
      await loadData();
    }

    async function saveTransaction(data) {
      if (!data.accountId || !data.categoryId) return alert('Conto e categoria richiesti');
      
      const tx = state.editingItem ? {
        ...state.editingItem,
        description: data.description,
        accountId: data.accountId,
        categoryId: data.categoryId,
        type: data.type,
        amount: data.amount,
        date: data.date,
        hidden: data.hidden,
        updatedAt: new Date().toISOString()
      } : {
        id: generateUUID(), // USA UUID NON AUTO-INCREMENT
        description: data.description,
        accountId: data.accountId,
        categoryId: data.categoryId,
        type: data.type,
        amount: data.amount,
        date: data.date,
        hidden: data.hidden || false,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        deleted: false,
        deleted_at: null
      };

      await dbOperation('transactions', 'readwrite', store => store.put(tx));
      
      if (state.supabaseClient && navigator.onLine) {
        await state.supabaseClient.from('transactions').upsert({
          id: tx.id,
          description: tx.description,
          account_id: tx.accountId,
          category_id: tx.categoryId,
          type: tx.type,
          amount: tx.amount,
          date: tx.date,
          hidden: tx.hidden,
          created_at: tx.createdAt,
          updated_at: tx.updatedAt,
          deleted: tx.deleted || false,
          deleted_at: tx.deleted_at || null
        });
      }
      
      closeModal();
      await loadData();
    }

    async function deleteItem(storeName, id) {
      if (!confirm('Eliminare?')) return;
      
      const item = await dbOperation(storeName, 'readonly', store => store.get(id));
      if (item) {
        item.deleted = true;
        item.deleted_at = new Date().toISOString();
        item.updated_at = new Date().toISOString();
        await dbOperation(storeName, 'readwrite', store => store.put(item));
        
        if (state.supabaseClient && navigator.onLine) {
          const tableName = storeName;
          const cloudData = {
            id: item.id,
            deleted: true,
            deleted_at: item.deleted_at,
            updated_at: item.updated_at
          };
          
          if (storeName === 'accounts') {
            cloudData.name = item.name;
            cloudData.initial_balance = item.initialBalance;
            cloudData.created_at = item.createdAt;
          } else if (storeName === 'categories') {
            cloudData.name = item.name;
            cloudData.color = item.color;
            cloudData.created_at = item.createdAt;
          } else if (storeName === 'transactions') {
            cloudData.description = item.description;
            cloudData.account_id = item.accountId;
            cloudData.category_id = item.categoryId;
            cloudData.type = item.type;
            cloudData.amount = item.amount;
            cloudData.date = item.date;
            cloudData.hidden = item.hidden;
            cloudData.created_at = item.createdAt;
          }
          
          await state.supabaseClient.from(tableName).upsert(cloudData);
        }
      }
      
      await loadData();
    }

    async function toggleHidden(tx) {
      tx.hidden = !tx.hidden;
      tx.updatedAt = new Date().toISOString();
      await dbOperation('transactions', 'readwrite', store => store.put(tx));
      
      if (state.supabaseClient && navigator.onLine) {
        await state.supabaseClient.from('transactions').upsert({
          id: tx.id,
          description: tx.description,
          account_id: tx.accountId,
          category_id: tx.categoryId,
          type: tx.type,
          amount: tx.amount,
          date: tx.date,
          hidden: tx.hidden,
          created_at: tx.createdAt,
          updated_at: tx.updatedAt,
          deleted: tx.deleted || false,
          deleted_at: tx.deleted_at || null
        });
      }
      
      await loadData();
    }

    function openModal(type, item = null) {
      state.currentModal = type;
      state.editingItem = item;
      render();
    }

    function closeModal() {
      state.currentModal = null;
      state.editingItem = null;
      render();
    }

    function getAvailableMonths() {
      const months = [];
      const currentDate = new Date(state.editingItem.date);
      const currentYear = currentDate.getFullYear();
      const currentMonth = currentDate.getMonth();
      
      for (let year = currentYear; year <= currentYear + 2; year++) {
        for (let month = 0; month < 12; month++) {
          if (year === currentYear && month <= currentMonth) continue;
          const date = new Date(year, month, 1);
          months.push({
            value: `${year}-${String(month + 1).padStart(2, '0')}`,
            label: date.toLocaleDateString('it-IT', { month: 'long', year: 'numeric' })
          });
        }
      }
      return months;
    }

    async function duplicateTransaction() {
      const checkboxes = document.querySelectorAll('.month-checkbox:checked');
      if (checkboxes.length === 0) return alert('Seleziona almeno un mese');
      
      const baseTx = state.editingItem;
      const baseDate = new Date(baseTx.date);
      
      for (const cb of checkboxes) {
        const [year, month] = cb.value.split('-').map(Number);
        const newDate = new Date(year, month - 1, baseDate.getDate());
        
        const newTx = {
          id: generateUUID(), // USA UUID NON AUTO-INCREMENT
          description: baseTx.description,
          accountId: baseTx.accountId,
          categoryId: baseTx.categoryId,
          type: baseTx.type,
          amount: baseTx.amount,
          date: newDate.toISOString().split('T')[0],
          hidden: baseTx.hidden,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
          deleted: false,
          deleted_at: null
        };
        
        await dbOperation('transactions', 'readwrite', store => store.add(newTx));
        
        if (state.supabaseClient && navigator.onLine) {
          await state.supabaseClient.from('transactions').insert({
            id: newTx.id,
            description: newTx.description,
            account_id: newTx.accountId,
            category_id: newTx.categoryId,
            type: newTx.type,
            amount: newTx.amount,
            date: newTx.date,
            hidden: newTx.hidden,
            created_at: newTx.createdAt,
            updated_at: newTx.updatedAt,
            deleted: false,
            deleted_at: null
          });
        }
      }
      
      closeModal();
      await loadData();
      alert(`✓ ${checkboxes.length} transazioni duplicate`);
    }

    function getFiltered() {
      return state.transactions.filter(tx => {
        const txDate = new Date(tx.date);
        if (txDate.getFullYear() !== state.filterYear) return false;
        if (tx.hidden && state.view !== 'hidden') return false;
        if (state.filterAccount !== 'all' && tx.accountId !== state.filterAccount) return false;
        if (state.filterCategory !== 'all' && tx.categoryId !== state.filterCategory) return false;
        return true;
      });
    }

    function getMonthlyData() {
      const filtered = getFiltered();
      const monthly = Array(12).fill(0);
      filtered.forEach(tx => {
        const month = new Date(tx.date).getMonth();
        monthly[month] += tx.type === 'income' ? parseFloat(tx.amount) : -parseFloat(tx.amount);
      });
      return monthly;
    }

    function getSummary() {
      const filtered = getFiltered();
      let income = 0, expense = 0;
      filtered.forEach(tx => {
        const amt = parseFloat(tx.amount);
        if (tx.type === 'income') income += amt;
        else expense += amt;
      });
      return { income, expense, balance: income - expense };
    }

    function getCategoryBreakdown() {
      const filtered = getFiltered();
      const breakdown = {};
      filtered.forEach(tx => {
        if (tx.type === 'expense') {
          const cat = state.categories.find(c => c.id === tx.categoryId);
          if (cat) {
            breakdown[cat.name] = (breakdown[cat.name] || 0) + parseFloat(tx.amount);
          }
        }
      });
      return Object.entries(breakdown).sort((a,b) => b[1] - a[1]);
    }

    function render() {
      if (state.showSupabaseSetup) {
        document.getElementById('app').innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-4">
            <div class="bg-gray-800 rounded-lg p-6 w-full max-w-md">
              <h2 class="text-2xl font-bold mb-4">Setup Supabase</h2>
              <input id="supa-url" placeholder="Supabase URL" class="w-full bg-gray-700 rounded p-2 mb-2" />
              <input id="supa-key" placeholder="Anon Key" class="w-full bg-gray-700 rounded p-2 mb-4" type="password" />
              <button onclick="setupSupabase()" class="w-full bg-blue-600 hover:bg-blue-700 rounded p-2 font-bold">Connetti</button>
            </div>
          </div>
        `;
        return;
      }

      const summary = getSummary();
      const monthlyData = getMonthlyData();
      const months = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
      const categoryBreakdown = getCategoryBreakdown();

      let html = `
        <div class="sticky top-0 bg-gray-900 z-10 border-b border-gray-800">
          <div class="flex items-center justify-between p-3">
            <button onclick="state.menuOpen = !state.menuOpen; render();" class="p-2 hover:bg-gray-800 rounded">☰</button>
            <h1 class="text-xl font-bold">FinTrack</h1>
            ${state.syncing ? '<span class="text-xs text-yellow-400">Sync...</span>' : 
              state.lastSync ? `<span class="text-xs text-gray-400">${new Date(state.lastSync).toLocaleTimeString('it-IT', {hour:'2-digit',minute:'2-digit'})}</span>` : ''}
          </div>
        </div>
      `;

      if (state.menuOpen) {
        html += `
          <div class="fixed inset-0 bg-black/70 z-20" onclick="state.menuOpen = false; render();">
            <div class="bg-gray-800 w-64 h-full p-4" onclick="event.stopPropagation();">
              <h2 class="text-lg font-bold mb-4">Menu</h2>
              <button onclick="state.view = 'dashboard'; state.menuOpen = false; render();" class="block w-full text-left p-2 mb-1 rounded hover:bg-gray-700">📊 Dashboard</button>
              <button onclick="state.view = 'transactions'; state.menuOpen = false; render();" class="block w-full text-left p-2 mb-1 rounded hover:bg-gray-700">💰 Transazioni</button>
              <button onclick="state.view = 'accounts'; state.menuOpen = false; render();" class="block w-full text-left p-2 mb-1 rounded hover:bg-gray-700">🏦 Conti</button>
              <button onclick="state.view = 'categories'; state.menuOpen = false; render();" class="block w-full text-left p-2 mb-1 rounded hover:bg-gray-700">📑 Categorie</button>
              <button onclick="state.view = 'hidden'; state.menuOpen = false; render();" class="block w-full text-left p-2 mb-1 rounded hover:bg-gray-700">👁️ Nascoste</button>
              <hr class="my-3 border-gray-700" />
              ${state.supabaseClient ? `<button onclick="syncBidirectional(); state.menuOpen = false;" class="block w-full text-left p-2 mb-1 rounded hover:bg-gray-700">🔄 Sincronizza</button>` : ''}
            </div>
          </div>
        `;
      }

      html += '<div class="p-4">';

      if (state.view === 'dashboard') {
        html += `
          <div class="mb-4 flex gap-2">
            <select onchange="state.filterYear = parseInt(this.value); render();" class="flex-1 bg-gray-800 rounded p-2">
              ${[...new Set(state.transactions.map(t => new Date(t.date).getFullYear()))].sort((a,b) => b-a).map(y => 
                `<option value="${y}" ${y === state.filterYear ? 'selected' : ''}>${y}</option>`
              ).join('')}
            </select>
            <select onchange="state.filterAccount = this.value; render();" class="flex-1 bg-gray-800 rounded p-2">
              <option value="all">Tutti i conti</option>
              ${state.accounts.map(a => `<option value="${a.id}" ${state.filterAccount === a.id ? 'selected' : ''}>${a.name}</option>`).join('')}
            </select>
          </div>

          <div class="grid grid-cols-3 gap-2 mb-4">
            <div class="bg-green-900/30 rounded-lg p-3">
              <div class="text-xs text-green-400 mb-1">Entrate</div>
              <div class="text-lg font-bold text-green-400">+${summary.income.toFixed(2)}€</div>
            </div>
            <div class="bg-red-900/30 rounded-lg p-3">
              <div class="text-xs text-red-400 mb-1">Uscite</div>
              <div class="text-lg font-bold text-red-400">-${summary.expense.toFixed(2)}€</div>
            </div>
            <div class="bg-blue-900/30 rounded-lg p-3">
              <div class="text-xs text-blue-400 mb-1">Saldo</div>
              <div class="text-lg font-bold ${summary.balance >= 0 ? 'text-green-400' : 'text-red-400'}">${summary.balance >= 0 ? '+' : ''}${summary.balance.toFixed(2)}€</div>
            </div>
          </div>

          <div class="bg-gray-800 rounded-lg p-4 mb-4">
            <h2 class="text-lg font-bold mb-3">Andamento Mensile ${state.filterYear}</h2>
            <div class="flex items-end gap-1 h-32">
              ${monthlyData.map((val, i) => {
                const height = Math.abs(val) / Math.max(...monthlyData.map(Math.abs)) * 100;
                return `
                  <div class="flex-1 flex flex-col items-center">
                    <div class="text-xs mb-1 ${val >= 0 ? 'text-green-400' : 'text-red-400'}">${val > 0 ? '+' : ''}${val.toFixed(0)}</div>
                    <div class="w-full ${val >= 0 ? 'bg-green-600' : 'bg-red-600'} rounded-t" style="height: ${height}%"></div>
                    <div class="text-xs mt-1 text-gray-400">${months[i]}</div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="bg-gray-800 rounded-lg p-4 mb-4">
            <h2 class="text-lg font-bold mb-3">Uscite per Categoria</h2>
            ${categoryBreakdown.slice(0, 5).map(([name, amt]) => {
              const pct = (amt / summary.expense * 100) || 0;
              return `
                <div class="mb-2">
                  <div class="flex justify-between text-sm mb-1">
                    <span>${name}</span>
                    <span class="font-bold">${amt.toFixed(2)}€</span>
                  </div>
                  <div class="bg-gray-700 rounded-full h-2">
                    <div class="bg-blue-500 rounded-full h-2" style="width: ${pct}%"></div>
                  </div>
                </div>
              `;
            }).join('')}
            ${categoryBreakdown.length === 0 ? '<p class="text-gray-400 text-center py-4">Nessuna uscita</p>' : ''}
          </div>

          <button onclick='openModal("transaction")' class="w-full bg-blue-600 hover:bg-blue-700 rounded-lg p-3 font-bold">+ Nuova Transazione</button>
        `;
      }

      if (state.view === 'transactions') {
        const filtered = getFiltered().sort((a,b) => new Date(b.date) - new Date(a.date));
        html += `
          <div class="mb-4 flex gap-2">
            <select onchange="state.filterYear = parseInt(this.value); render();" class="flex-1 bg-gray-800 rounded p-2">
              ${[...new Set(state.transactions.map(t => new Date(t.date).getFullYear()))].sort((a,b) => b-a).map(y => 
                `<option value="${y}" ${y === state.filterYear ? 'selected' : ''}>${y}</option>`
              ).join('')}
            </select>
            <select onchange="state.filterCategory = this.value; render();" class="flex-1 bg-gray-800 rounded p-2">
              <option value="all">Tutte categorie</option>
              ${state.categories.map(c => `<option value="${c.id}" ${state.filterCategory === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
            </select>
          </div>

          <button onclick='openModal("transaction")' class="w-full bg-blue-600 hover:bg-blue-700 rounded-lg p-3 mb-4 font-bold">+ Nuova</button>

          <div class="space-y-2">
            ${filtered.map(tx => {
              const acc = state.accounts.find(a => a.id === tx.accountId);
              const cat = state.categories.find(c => c.id === tx.categoryId);
              return `
                <div class="bg-gray-800 rounded-lg p-3">
                  <div class="flex justify-between mb-2">
                    <div>
                      <div class="text-sm text-gray-400">${tx.date}</div>
                      <div class="font-medium">${tx.description || 'Senza descrizione'}</div>
                      <div class="text-xs text-gray-400">${acc?.name || ''} • ${cat?.name || ''}</div>
                    </div>
                    <div class="font-bold text-lg ${tx.type === 'income' ? 'text-green-400' : 'text-red-400'}">
                      ${tx.type === 'income' ? '+' : '-'}${tx.amount}€
                    </div>
                  </div>
                  <div class="flex gap-1 text-xs">
                    <button onclick='openModal("transaction", ${JSON.stringify(tx).replace(/'/g, "&#39;")})' class="flex-1 p-1.5 bg-gray-700 hover:bg-gray-600 rounded">✏️ Modifica</button>
                    <button onclick='state.editingItem = ${JSON.stringify(tx).replace(/'/g, "&#39;")}; openModal("duplicate")' class="flex-1 p-1.5 bg-gray-700 hover:bg-gray-600 rounded">📋 Duplica</button>
                    <button onclick='toggleHidden(${JSON.stringify(tx).replace(/'/g, "&#39;")})' class="flex-1 p-1.5 bg-gray-700 hover:bg-gray-600 rounded">👁️</button>
                    <button onclick="deleteItem('transactions', '${tx.id}')" class="flex-1 p-1.5 bg-red-600 hover:bg-red-700 rounded">🗑️</button>
                  </div>
                </div>
              `;
            }).join('')}
            ${filtered.length === 0 ? '<p class="text-gray-400 text-center py-8">Nessuna transazione</p>' : ''}
          </div>
        `;
      }

      if (state.view === 'accounts') {
        const balances = {};
        state.accounts.forEach(acc => {
          balances[acc.id] = acc.initialBalance;
        });
        state.transactions.forEach(tx => {
          if (balances[tx.accountId] !== undefined) {
            balances[tx.accountId] += tx.type === 'income' ? parseFloat(tx.amount) : -parseFloat(tx.amount);
          }
        });

        html += `
          <button onclick='openModal("account")' class="w-full bg-blue-600 hover:bg-blue-700 rounded-lg p-3 mb-4 font-bold">+ Nuovo Conto</button>
          ${state.accounts.map(acc => `
            <div class="bg-gray-800 rounded-lg p-4 mb-2">
              <div class="flex justify-between items-center mb-2">
                <h3 class="font-bold text-lg">${acc.name}</h3>
                <div class="text-right">
                  <div class="text-sm text-gray-400">Iniziale: ${acc.initialBalance.toFixed(2)}€</div>
                  <div class="font-bold text-lg ${balances[acc.id] >= 0 ? 'text-green-400' : 'text-red-400'}">
                    ${balances[acc.id].toFixed(2)}€
                  </div>
                </div>
              </div>
              <button onclick="deleteItem('accounts', '${acc.id}')" class="w-full p-2 bg-red-600 hover:bg-red-700 rounded text-sm">Elimina</button>
            </div>
          `).join('')}
          ${state.accounts.length === 0 ? '<p class="text-gray-400 text-center py-8">Nessun conto</p>' : ''}
        `;
      }

      if (state.view === 'categories') {
        html += `
          <button onclick='openModal("category")' class="w-full bg-blue-600 hover:bg-blue-700 rounded-lg p-3 mb-4 font-bold">+ Nuova Categoria</button>
          ${state.categories.map(cat => `
            <div class="bg-gray-800 rounded-lg p-4 mb-2 flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded" style="background-color: ${cat.color}"></div>
                <span class="font-medium">${cat.name}</span>
              </div>
              <button onclick="deleteItem('categories', '${cat.id}')" class="p-2 bg-red-600 hover:bg-red-700 rounded text-sm">Elimina</button>
            </div>
          `).join('')}
          ${state.categories.length === 0 ? '<p class="text-gray-400 text-center py-8">Nessuna categoria</p>' : ''}
        `;
      }

      if (state.view === 'hidden') {
        const hidden = state.transactions.filter(tx => tx.hidden && new Date(tx.date).getFullYear() === state.filterYear).sort((a,b) => new Date(b.date) - new Date(a.date));
        let hiddenTotal = 0;
        hidden.forEach(tx => {
          hiddenTotal += tx.type === 'income' ? parseFloat(tx.amount) : -parseFloat(tx.amount);
        });
        html += `
          <div class="bg-gray-800 rounded-lg p-4 mb-4">
            <h2 class="text-lg font-bold mb-2">Transazioni Nascoste ${state.filterYear}</h2>
            <div class="text-2xl font-bold ${hiddenTotal >= 0 ? 'text-green-400' : 'text-red-400'}">
              ${hiddenTotal >= 0 ? '+' : ''}${hiddenTotal.toFixed(2)}€
            </div>
          </div>
          <div class="bg-gray-800 rounded-lg p-4">
            ${hidden.map(tx => {
              const acc = state.accounts.find(a => a.id === tx.accountId);
              const cat = state.categories.find(c => c.id === tx.categoryId);
              return `
                <div class="p-3 rounded bg-gray-700/50 mb-2">
                  <div class="flex justify-between mb-2">
                    <div>
                      <div class="text-sm text-gray-400">${tx.date}</div>
                      <div class="font-medium">${tx.description || 'Senza descrizione'}</div>
                      <div class="text-sm text-gray-400">${acc?.name || ''} • ${cat?.name || ''}</div>
                    </div>
                    <div class="font-bold ${tx.type === 'income' ? 'text-green-400' : 'text-red-400'}">
                      ${tx.type === 'income' ? '+' : '-'}${tx.amount}€
                    </div>
                  </div>
                  <div class="flex gap-1 text-xs">
                    <button onclick='openModal("transaction", ${JSON.stringify(tx).replace(/'/g, "&#39;")})' class="flex-1 p-1.5 bg-gray-600 rounded">✏️</button>
                    <button onclick='toggleHidden(${JSON.stringify(tx).replace(/'/g, "&#39;")})' class="flex-1 p-1.5 bg-gray-600 rounded">👁️ Mostra</button>
                    <button onclick="deleteItem('transactions', '${tx.id}')" class="flex-1 p-1.5 bg-red-600 rounded">🗑️</button>
                  </div>
                </div>
              `;
            }).join('')}
            ${hidden.length === 0 ? '<p class="text-gray-400 text-center py-8">Nessuna transazione nascosta</p>' : ''}
          </div>
        `;
      }

      html += '</div>';

      // Modals
      if (state.currentModal === 'account') {
        html += `
          <div class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
            <div class="bg-gray-800 rounded-lg p-6 w-full max-w-md">
              <h2 class="text-xl font-bold mb-4">Nuovo Conto</h2>
              <input id="acc-name" placeholder="Nome" class="w-full bg-gray-700 rounded p-2 mb-2" />
              <input id="acc-balance" type="number" value="0" placeholder="Saldo iniziale" class="w-full bg-gray-700 rounded p-2 mb-4" />
              <div class="flex gap-2">
                <button onclick="saveAccount(document.getElementById('acc-name').value, document.getElementById('acc-balance').value)" class="flex-1 bg-blue-600 hover:bg-blue-700 rounded p-2 font-bold">Salva</button>
                <button onclick="closeModal()" class="flex-1 bg-gray-700 hover:bg-gray-600 rounded p-2">Annulla</button>
              </div>
            </div>
          </div>
        `;
      }

      if (state.currentModal === 'category') {
        html += `
          <div class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
            <div class="bg-gray-800 rounded-lg p-6 w-full max-w-md">
              <h2 class="text-xl font-bold mb-4">Nuova Categoria</h2>
              <input id="cat-name" placeholder="Nome" class="w-full bg-gray-700 rounded p-2 mb-2" />
              <input id="cat-color" type="color" value="#3b82f6" class="w-full bg-gray-700 rounded p-2 h-12 mb-4" />
              <div class="flex gap-2">
                <button onclick="saveCategory(document.getElementById('cat-name').value, document.getElementById('cat-color').value)" class="flex-1 bg-blue-600 hover:bg-blue-700 rounded p-2 font-bold">Salva</button>
                <button onclick="closeModal()" class="flex-1 bg-gray-700 hover:bg-gray-600 rounded p-2">Annulla</button>
              </div>
            </div>
          </div>
        `;
      }

      if (state.currentModal === 'transaction') {
        const editing = state.editingItem;
        html += `
          <div class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50 overflow-y-auto">
            <div class="bg-gray-800 rounded-lg p-6 w-full max-w-md my-8">
              <h2 class="text-xl font-bold mb-4">${editing ? 'Modifica' : 'Nuova'} Transazione</h2>
              <input id="tx-desc" value="${editing?.description || ''}" placeholder="Descrizione" class="w-full bg-gray-700 rounded p-2 mb-2 text-sm" />
              <select id="tx-acc" class="w-full bg-gray-700 rounded p-2 mb-2 text-sm">
                <option value="">Seleziona conto</option>
                ${state.accounts.map(a => `<option value="${a.id}" ${editing?.accountId === a.id ? 'selected' : ''}>${a.name}</option>`).join('')}
              </select>
              <select id="tx-cat" class="w-full bg-gray-700 rounded p-2 mb-2 text-sm">
                <option value="">Seleziona categoria</option>
                ${state.categories.map(c => `<option value="${c.id}" ${editing?.categoryId === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
              </select>
              <select id="tx-type" class="w-full bg-gray-700 rounded p-2 mb-2 text-sm">
                <option value="income" ${editing?.type === 'income' ? 'selected' : ''}>Entrata</option>
                <option value="expense" ${editing?.type === 'expense' ? 'selected' : ''}>Uscita</option>
              </select>
              <input id="tx-amount" type="number" step="0.01" value="${editing?.amount || 0}" placeholder="Importo" class="w-full bg-gray-700 rounded p-2 mb-2 text-sm" />
              <input id="tx-date" type="date" value="${editing?.date || new Date().toISOString().split('T')[0]}" class="w-full bg-gray-700 rounded p-2 mb-2 text-sm" />
              <label class="flex items-center gap-2 mb-4">
                <input id="tx-hidden" type="checkbox" ${editing?.hidden ? 'checked' : ''} />
                <span class="text-sm">Nascondi dalle analisi</span>
              </label>
              <div class="flex gap-2">
                <button onclick="saveTransaction({description: document.getElementById('tx-desc').value, accountId: document.getElementById('tx-acc').value, categoryId: document.getElementById('tx-cat').value, type: document.getElementById('tx-type').value, amount: parseFloat(document.getElementById('tx-amount').value), date: document.getElementById('tx-date').value, hidden: document.getElementById('tx-hidden').checked})" class="flex-1 bg-blue-600 hover:bg-blue-700 rounded p-2 font-bold">Salva</button>
                <button onclick="closeModal()" class="flex-1 bg-gray-700 hover:bg-gray-600 rounded p-2">Annulla</button>
              </div>
            </div>
          </div>
        `;
      }

      if (state.currentModal === 'duplicate') {
        const availableMonths = getAvailableMonths();
        html += `
          <div class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50 overflow-y-auto">
            <div class="bg-gray-800 rounded-lg p-6 w-full max-w-md my-8">
              <h2 class="text-xl font-bold mb-4">Duplica Transazione</h2>
              <p class="text-sm text-gray-400 mb-3">Seleziona i mesi su cui copiare questa transazione</p>
              <div class="space-y-2 max-h-80 overflow-y-auto mb-4 bg-gray-700 rounded p-2">
                ${availableMonths.map(m => `
                  <label class="flex items-center gap-2 p-2 hover:bg-gray-600 rounded cursor-pointer">
                    <input type="checkbox" value="${m.value}" class="month-checkbox w-4 h-4" />
                    <span class="text-sm">${m.label}</span>
                  </label>
                `).join('')}
              </div>
              <div class="text-sm text-gray-400 mb-3">
                <span id="selected-count">0</span> mese/i selezionato/i
              </div>
              <div class="flex gap-2">
                <button onclick="duplicateTransaction()" class="flex-1 bg-blue-600 hover:bg-blue-700 rounded p-2 font-bold">Duplica</button>
                <button onclick="closeModal()" class="flex-1 bg-gray-700 hover:bg-gray-600 rounded p-2">Annulla</button>
              </div>
            </div>
          </div>
        `;
      }

      document.getElementById('app').innerHTML = html;

      // Update selected months count
      if (state.currentModal === 'duplicate') {
        const checkboxes = document.querySelectorAll('.month-checkbox');
        checkboxes.forEach(cb => {
          cb.addEventListener('change', () => {
            const count = document.querySelectorAll('.month-checkbox:checked').length;
            document.getElementById('selected-count').textContent = count;
          });
        });
      }
    }

    // Init
    (async () => {
      await checkSupabaseConfig();
      await loadData();
    })();
  </script>
</body>
</html>
